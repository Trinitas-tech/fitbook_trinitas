security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]
        ROLE_MANAGER: [ROLE_USER]
        ROLE_COACH: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\Security\LoginFailureHandler
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    # Seule la première règle correspondante est appliquée
    access_control:
        - { path: ^/api/auth/(register|login|verify-email|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/api/(search|activities|gyms|coaches|courses|sessions)(/|$), roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/admin(/|$), roles: ROLE_ADMIN }
        - { path: ^/api/manager(/|$), roles: ROLE_MANAGER }
        - { path: ^/api/coach(/|$), roles: ROLE_COACH }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
